<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Forex Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Forex Tool</h1>
  <div id="status">Conectando...</div>

  <section id="buscador">
    <h2>Buscar vela</h2>

    <label>Símbolo:
      <input type="text" id="symbol" value="AUDUSD">
    </label>

    <label>Timeframe:
      <input type="text" id="timeframe" value="M15">
    </label>

    <label>Fecha:
      <input type="date" id="fecha">
    </label>

    <label>Hora (24h):
      <select id="hora"></select>
    </label>

    <label>Minuto:
      <select id="minuto">
        <option value="00">00</option>
        <option value="15">15</option>
        <option value="30">30</option>
        <option value="45">45</option>
      </select>
    </label>

    <button id="btnBuscar">Buscar vela</button>

    <div id="resultado" style="display:none;">
      <h3>Vela encontrada</h3>
      <p id="infoVela"></p>

      <label>Nota (opcional):
        <textarea id="nota"></textarea>
      </label>

      <button id="btnBuyO">Buy O</button>
      <button id="btnBuyX">Buy X</button>
      <button id="btnSellO">Sell O</button>
      <button id="btnSellX">Sell X</button>

      <p id="mensajeMarcado"></p>

      <hr>
      <button id="btnSimilar">Buscar punto similar</button>
      <p id="cargandoSimilar" style="display:none;">Buscando entre los puntos marcados...</p>

      <div id="resultadoSimilar" style="display:none;">
        <h3>Punto más parecido</h3>
        <p id="infoSimilar"></p>
        <p><strong>Diferencia total: <span id="porcentajeTotal"></span></strong></p>

        <table id="tablaVariables" border="1" cellpadding="4" style="border-collapse:collapse; width:100%;">
          <thead>
            <tr><th>Variable</th><th>Punto actual</th><th>Punto encontrado</th><th>Diferencia</th><th>% diferencia</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
