<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forex Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Forex Tool</span>
    </div>
    <div class="topbar-right">
      <span id="status" class="status-pill">Conectando…</span>
      <button id="btnLogout" class="btn btn-ghost" style="display:none;">Salir</button>
    </div>
  </header>

  <main class="wrap">

    <section id="login" class="card card-narrow">
      <h2>Iniciar sesión</h2>
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tu@correo.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button id="btnLogin" class="btn btn-primary btn-block">Entrar</button>
      <p id="mensajeLogin" class="msg"></p>
    </section>

    <section id="buscador" class="card" style="display:none;">
      <h2>Buscar vela</h2>

      <div class="field-row">
        <div class="field">
          <label for="symbol">Símbolo</label>
          <input type="text" id="symbol" value="AUDUSD">
        </div>
        <div class="field field-sm">
          <label for="timeframe">TF</label>
          <input type="text" id="timeframe" value="M15">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha">
        </div>
        <div class="field field-sm">
          <label for="hora">Hora</label>
          <select id="hora"></select>
        </div>
        <div class="field field-sm">
          <label for="minuto">Min</label>
          <select id="minuto">
            <option value="00">00</option>
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="45">45</option>
          </select>
        </div>
      </div>

      <button id="btnBuscar" class="btn btn-primary btn-block">Buscar vela</button>

      <div id="resultado" class="reveal" style="display:none;">

        <div class="candle-info">
          <span class="candle-label">Vela encontrada</span>
          <p id="infoVela" class="candle-values"></p>
        </div>

        <div class="field">
          <label for="nota">Nota (opcional)</label>
          <textarea id="nota" rows="2"></textarea>
        </div>

        <div class="button-grid">
          <button id="btnBuyO" class="btn btn-buy">Buy O</button>
          <button id="btnBuyX" class="btn btn-buy btn-outline">Buy X</button>
          <button id="btnSellO" class="btn btn-sell">Sell O</button>
          <button id="btnSellX" class="btn btn-sell btn-outline">Sell X</button>
        </div>

        <p id="mensajeMarcado" class="msg"></p>

        <div class="divider"></div>

        <button id="btnSimilar" class="btn btn-secondary btn-block">Buscar punto similar</button>
        <p id="cargandoSimilar" class="msg msg-loading" style="display:none;">Buscando entre los puntos marcados…</p>

        <div id="resultadoSimilar" class="reveal" style="display:none;">
          <div class="candle-info">
            <span class="candle-label">Punto más parecido</span>
            <p id="infoSimilar" class="candle-values"></p>
          </div>

          <div class="score-row">
            <span class="score-label">Diferencia total</span>
            <span id="porcentajeTotal" class="score-value"></span>
          </div>

          <div class="table-scroll">
            <table id="tablaVariables">
              <thead>
                <tr><th>Variable</th><th>Actual</th><th>Encontrado</th><th>Dif.</th><th>%</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
